name: CI

# (#23) Every push to main and every pull request runs the backend test suite:
# checkout money/stock/atomicity rules, the access-control policy layer, and the
# security negative paths (unknown tables, forged owners, unauthorised OTP and
# notification writes, secret exposure).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
